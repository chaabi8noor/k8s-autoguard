name: Security scans

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-scans:
    name: Trivy security scans
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run Trivy manifest gate
        run: ./scripts/scan-trivy.sh --config
      - name: Run Trivy pinned-image report
        run: >-
          ./scripts/scan-trivy.sh --image
          quay.io/cilium/alpine-curl:v1.10.0@sha256:913e8c9f3d960dde03882defa0edd3a919d529c2eb167caa7f54194528bde364
