apiVersion: v1
kind: Namespace
metadata:
  name: autoguard-system
  labels:
    app.kubernetes.io/part-of: k8s-autoguard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoguard-ml-api
  namespace: autoguard-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoguard-remediation
  namespace: autoguard-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autoguard-remediation-isolation
  namespace: autoguard-demo
rules:
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autoguard-remediation-isolation
  namespace: autoguard-demo
subjects:
  - kind: ServiceAccount
    name: autoguard-remediation
    namespace: autoguard-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: autoguard-remediation-isolation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoguard-ml-api
  namespace: autoguard-system
  labels:
    app.kubernetes.io/name: autoguard-ml-api
    app.kubernetes.io/part-of: k8s-autoguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: autoguard-ml-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoguard-ml-api
        app.kubernetes.io/part-of: k8s-autoguard
    spec:
      serviceAccountName: autoguard-ml-api
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: k8s-autoguard-platform:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "ml.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: autoguard-ml-api
  namespace: autoguard-system
  labels:
    app.kubernetes.io/name: autoguard-ml-api
spec:
  selector:
    app.kubernetes.io/name: autoguard-ml-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoguard-remediation
  namespace: autoguard-system
  labels:
    app.kubernetes.io/name: autoguard-remediation
    app.kubernetes.io/part-of: k8s-autoguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: autoguard-remediation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoguard-remediation
        app.kubernetes.io/part-of: k8s-autoguard
    spec:
      serviceAccountName: autoguard-remediation
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: k8s-autoguard-platform:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "remediation.runtime:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: AUTOGUARD_ML_API_URL
              value: http://autoguard-ml-api.autoguard-system.svc.cluster.local:8000/predict
            - name: AUTOGUARD_EXECUTION_MODE
              value: dry-run
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: autoguard-remediation
  namespace: autoguard-system
  labels:
    app.kubernetes.io/name: autoguard-remediation
spec:
  selector:
    app.kubernetes.io/name: autoguard-remediation
  ports:
    - name: http
      port: 8000
      targetPort: http
