apiVersion: v1
kind: Namespace
metadata:
  name: autoguard-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: autoguard-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: autoguard-policy-demo
    spec:
      containers:
        - name: api
          # This pinned Nginx-based image is already used by the Hubble UI in the lab.
          image: quay.io/cilium/hubble-ui:v0.13.5@sha256:f7d514fc54d784ed6df9d58cf0e97648b143f92b766dd1780ed3fc845bd4c516
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: autoguard-demo
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trusted-client
  namespace: autoguard-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trusted-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trusted-client
        access: trusted
    spec:
      containers:
        - name: client
          image: quay.io/cilium/alpine-curl:v1.10.0@sha256:913e8c9f3d960dde03882defa0edd3a919d529c2eb167caa7f54194528bde364
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: untrusted-client
  namespace: autoguard-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: untrusted-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: untrusted-client
        access: untrusted
    spec:
      containers:
        - name: client
          image: quay.io/cilium/alpine-curl:v1.10.0@sha256:913e8c9f3d960dde03882defa0edd3a919d529c2eb167caa7f54194528bde364
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
