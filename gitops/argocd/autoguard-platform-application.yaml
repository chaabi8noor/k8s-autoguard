apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-autoguard-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: k8s-autoguard
spec:
  project: default
  source:
    repoURL: https://github.com/chaabi8noor/k8s-autoguard.git
    targetRevision: main
    path: deployments/autoguard-platform
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: autoguard-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
