grafana:
  defaultDashboardsEnabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      isDefaultDatasource: true
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.loki.svc.cluster.local:3100
      editable: false
  livenessProbe:
    initialDelaySeconds: 180
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 1Gi

# Prometheus and Grafana are the evidence layer for this local AutoGuard lab.
# Alertmanager and kube-state-metrics are intentionally omitted: they are not
# inputs to the dashboard and otherwise introduce additional registry pulls.
kubeStateMetrics:
  enabled: false

alertmanager:
  enabled: false

# Node-exporter is useful for host-capacity analysis, but the AutoGuard
# evidence dashboard does not consume its metrics. Avoid a host-level
# DaemonSet in the constrained local lab.
nodeExporter:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

prometheus:
  prometheusSpec:
    retention: 24h
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false
